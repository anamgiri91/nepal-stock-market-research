[[table]]
id = "T14"
section = "10"
title = "Held-out evaluation — registered result and post-hoc diagnostics"
producer = "scripts/11_ho2_confirmatory.py"
output = "output/tables/table17_ho2_confirmatory.csv"
sample = "HO-2: panel A restricted to 1995 -> 2024-03-03, buckets = year x decile of N-hat, thin cells N-hat < 30"
status = "D"
remedy_class = "never-executable"
issue = "A-058"
note = """SPLICE DISCLOSED, TABLE STILL UNREPRODUCIBLE — two separate problems, one resolved.

A-056 (the spliced triple) is resolved by disclosure rather than by changing a number. Section 10 now uses a three-layer structure: the historical record (N = 325,901, beta = +0.0804, t = 6.69) with an explicit statement that no single execution produced it; the consequence for confirmatory status; and the current reconstruction (N = 325,262, beta = +0.0805, t = 6.71) reported AS a reconstruction. The chain is exact and reconciled in scripts/24_duplicate_key_reconciliation.py: 325,901 + 32 - 671 = 325,262 (A-065). Running the current filter chain WITHOUT the duplicate rule reproduces the 1628a08 vintage to the digit, 325,933 / +0.0804 / 6.72 (A-066), which pins the mechanism but does not establish a single historical execution behind the published triple. The classification stays assembly-error in substance; only new historical evidence would change it.

The table remains D for a different reason: its five post-hoc rows (+0.0667, +0.2518, +0.0815, +0.0678) have no generating code anywhere in scripts/ or src/ (A-058). Nothing computes a Mundlak decomposition. Section 10 now says so in the text."""

