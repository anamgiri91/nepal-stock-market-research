# Manuscript table registry — declarative provenance for every table in paper/main.md
#
# Checked mechanically by `paper/audit_tables.py`, which FAILS on any of:
#   1. a table in the manuscript that is absent from this registry
#   2. a registered producer that does not exist
#   3. a registered output that is not present
#   4. an output older than its producer (stale artifact)
#   5. an output the producer does not actually write (no static link in its source)
#   6. status D without a remedy class and an issue id
#   7. status B without a documented transformation
#   8. a manually assembled table without a justification
#
# The checker resolves producers FROM THIS FILE ONLY. It never globs `scripts/[0-9]*.py`,
# because `run_pipeline.sh` discovers work by that glob and an audit sharing it would inherit
# exactly the blind spot that let an unregistered table survive.
#
# STATUS
#   A  executable producer + persisted output + values reproduced
#   B  executable computation, but the output needs a documented transformation
#      (or is printed rather than persisted)
#   C  persisted artifact exists but producer provenance is incomplete
#   D  no executable provenance, or a demonstrated discrepancy
#   N  outside the taxonomy: the table carries no computed statistic
#
# REMEDY CLASS (required for D) — these have different fixes, and conflating them is the trap
#   bad-number         the value is wrong
#   stale-artifact     the artifact drifted from the code that makes it
#   lost-producer      a legitimate historical result whose generating code is gone
#   assembly-error     the manuscript table was assembled from more than one run
#   never-executable   the definition was never expressed as runnable code

[meta]
version = 1
manuscript = "paper/main.md"
audited = "2026-08-29"
evidence = "private/audit/TABLE-PROVENANCE-AUDIT.md"
status_note = "Science freeze suspended for provenance repair; no scientific changes authorized."

